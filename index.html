<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: radial-gradient(circle at top, #ffd6e7, #ff8fb1);
      color: #b3005e;
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 25px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 90%;
      animation: fadeIn 1s ease;
    }

    h1 {
      margin-top: 0;
      font-size: 2.4em;
    }

    .heart {
      font-size: 3.5em;
      animation: pulse 1.2s infinite;
    }

    .question {
      font-size: 1.4em;
      margin: 25px 0 30px;
      min-height: 60px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: linear-gradient(135deg, #ff4d8d, #ff2f73);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.1em;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 18px rgba(255, 77, 141, 0.45);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 77, 141, 0.6);
    }

    button.no {
      background: linear-gradient(135deg, #bdbdbd, #9e9e9e);
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    .message {
      margin-top: 25px;
      font-size: 1.3em;
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      background: red;
      opacity: 0.8;
      animation: fall linear forwards;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }

    @media (max-width: 600px) {
      h1 { font-size: 2em; }
      .question { font-size: 1.2em; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>Happy Valentine’s Day</h1>

    <div id="content">
      <div class="question" id="questionText"></div>
      <div class="buttons">
        <button onclick="answer(true)">Yes 💖</button>
        <button class="no" onclick="answer(false)">No 🙃</button>
      </div>
    </div>

    <div class="message" id="finalMessage"></div>
  </div>

  <script>
    let current = 1;

    const questions = [
      "Would you be my Valentine?",
      "Do you love me more than chocolate? 🍫",
      "Will you go on a date with me?",
      "Can I kiss you under the stars? ✨"
    ];

    document.getElementById("questionText").textContent = questions[0];

    function answer(isYes) {
      const msg = document.getElementById("finalMessage");

      if (isYes) {
        if (current < questions.length) {
          msg.style.display = "block";
          msg.textContent = "Aww 🥰 next one...";
          setTimeout(() => {
            msg.style.display = "none";
            document.getElementById("questionText").textContent = questions[current];
            current++;
          }, 900);
        } else {
          document.getElementById("content").style.display = "none";
          msg.style.display = "block";
          msg.textContent = "Yes! I love you so much 💕 Happy Valentine’s Day!";
          launchConfetti();
        }
      } else {
        msg.style.display = "block";
        msg.textContent = "Hmm… let’s try again 😏";
        current = 1;
        setTimeout(() => {
          msg.style.display = "none";
          document.getElementById("questionText").textContent = questions[0];
        }, 1200);
      }
    }

    function launchConfetti() {
      for (let i = 0; i < 40; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = `hsl(${Math.random()*360}, 80%, 60%)`;
        c.style.animationDuration = (2 + Math.random() * 3) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }
    }
  </script>
</body>
</html>
